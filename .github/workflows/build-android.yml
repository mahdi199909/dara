name: Build Android APK

# Two things happen here:
#
#  - Every push to master (and a manual run from the Actions tab) builds the APK and keeps it as a
#    workflow artifact named parvaapp-apk — a test build, nobody is told about it.
#
#  - Pushing a version tag (v1.1.0, matching package.json) ALSO publishes that APK as the GitHub
#    Release asset parvaapp.apk. GitHub serves the newest release's asset at
#    https://github.com/mahdi199909/dara/releases/latest/download/parvaapp.apk, and the server
#    redirects the permanent link https://my.parvaapp.ir/parvaapp.apk there (next.config.mjs), so
#    the tag is the only per-release step. See "Releasing a new APK" in DEPLOYMENT.md.
#
# No GitHub Secrets are required: scripts/build-android.mjs strips out everything (API routes,
# middleware) that would need a real DATABASE_URL/JWT_SECRET at runtime, so the placeholder
# value below only needs to satisfy `prisma generate`'s schema validation at build time, never
# a live connection.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the release step below writes anything (a Release in this repo), and only on tag pushes.
    permissions:
      contents: write
    env:
      DATABASE_URL: "file:./dev.db"
      # Baked into the static export at build time (see src/app/(app)/settings/page.tsx's
      # membership panel) — not secret, so plain repository Variables rather than Secrets.
      # Blank until set at GitHub → Settings → Secrets and variables → Actions → Variables.
      NEXT_PUBLIC_PAYMENT_CARD_NUMBER: ${{ vars.PAYMENT_CARD_NUMBER }}
      NEXT_PUBLIC_PAYMENT_BANK_NAME: ${{ vars.PAYMENT_BANK_NAME }}
      NEXT_PUBLIC_PAYMENT_CARD_HOLDER: ${{ vars.PAYMENT_CARD_HOLDER }}
      NEXT_PUBLIC_PAYMENT_CONTACT_ID: ${{ vars.PAYMENT_CONTACT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x requires Node >=22 (fails at `cap sync` otherwise, with
          # "[fatal] The Capacitor CLI requires NodeJS >=22.0.0") — this is also why it
          # worked in local testing (Node 24 there) but not on this pinned runner version.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ANDROID_VERSION_NAME / ANDROID_VERSION_CODE, read by android/app/build.gradle. The code is
      # derived from the version (1.1.0 -> 10100, see src/lib/appVersion.ts) so it always grows with
      # it and equals what the server announces; a package.json that disagrees with the announced
      # release fails the build right here.
      - name: Read the app version from package.json
        run: npx tsx scripts/app-version.ts >> "$GITHUB_ENV"

      - name: Check the tag matches package.json (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "v$ANDROID_VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json's version $ANDROID_VERSION_NAME"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8.x's Android Gradle modules (capacitor.build.gradle,
          # capacitor-cordova-android-plugins) set sourceCompatibility/targetCompatibility
          # to JavaVersion.VERSION_21 — javac fails with "invalid source release: 21" on
          # anything older, so this must match.
          java-version: 21

      - name: Build the static web export (Android variant)
        run: npm run build:android

      - name: Sync the Capacitor native project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The one name everything uses. The badging check fails the build if the file doesn't carry the
      # version, the application id or the launcher name it is supposed to — that is what every
      # install and every "is there an update" comparison relies on.
      - name: Name the APK parvaapp.apk and check what is inside it
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk parvaapp.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump badging parvaapp.apk > badging.txt
          grep -E "^(package:|application-label:)" badging.txt
          grep -E "^package: " badging.txt | grep -q "name='ir.mganic.dara'"
          grep -E "^package: " badging.txt | grep -q "versionCode='$ANDROID_VERSION_CODE'"
          grep -E "^package: " badging.txt | grep -q "versionName='$ANDROID_VERSION_NAME'"
          grep -q "^application-label:'پروا | سیستم‌عامل شخصی'$" badging.txt
          ls -l parvaapp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: parvaapp-apk
          path: parvaapp.apk
          if-no-files-found: error

      - name: Publish the GitHub Release (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run of the same tag replaces the file instead of failing.
            gh release upload "$TAG" parvaapp.apk --clobber
          else
            gh release create "$TAG" parvaapp.apk \
              --title "پروا $ANDROID_VERSION_NAME" \
              --notes "پروا $ANDROID_VERSION_NAME (build $ANDROID_VERSION_CODE). Permanent download link: https://my.parvaapp.ir/parvaapp.apk" \
              --verify-tag
          fi
