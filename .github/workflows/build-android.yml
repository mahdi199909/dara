name: Build Android APK

# Runs on every push to master (so the very first push already produces a downloadable APK
# with no extra manual step) and can also be re-run anytime from the Actions tab. No GitHub
# Secrets are required: scripts/build-android.mjs strips out everything (API routes,
# middleware) that would need a real DATABASE_URL/JWT_SECRET at runtime, so the placeholder
# value below only needs to satisfy `prisma generate`'s schema validation at build time, never
# a live connection.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x requires Node >=22 (fails at `cap sync` otherwise, with
          # "[fatal] The Capacitor CLI requires NodeJS >=22.0.0") — this is also why it
          # worked in local testing (Node 24 there) but not on this pinned runner version.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8.x's Android Gradle modules (capacitor.build.gradle,
          # capacitor-cordova-android-plugins) set sourceCompatibility/targetCompatibility
          # to JavaVersion.VERSION_21 — javac fails with "invalid source release: 21" on
          # anything older, so this must match.
          java-version: 21

      - name: Build the static web export (Android variant)
        run: npm run build:android

      - name: Sync the Capacitor native project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dara-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
