version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hesabkon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: hesabkon
    volumes:
      - hesabkon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesabkon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hesabkon:${POSTGRES_PASSWORD:-changeme}@postgres:5432/hesabkon?schema=public
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env}
      SESSION_COOKIE_NAME: hesabkon_session
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  hesabkon_pgdata:
