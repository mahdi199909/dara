version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hesabkon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: hesabkon
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - hesabkon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesabkon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hesabkon:${POSTGRES_PASSWORD:-changeme}@postgres:5432/hesabkon?schema=public
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env}
      SESSION_COOKIE_NAME: hesabkon_session
      NODE_ENV: production
      # Day boundaries (habit check-ins, reports, calendar) follow this — see the Dockerfile.
      TZ: ${TZ:-Asia/Tehran}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Logging (see doc/logging/architecture.md). One JSON line per record on stdout.
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_LEVEL_OVERRIDES: ${LOG_LEVEL_OVERRIDES:-}
      LOG_SLOW_REQUEST_MS: ${LOG_SLOW_REQUEST_MS:-1000}
      LOG_SLOW_QUERY_MS: ${LOG_SLOW_QUERY_MS:-300}
      # The names the logging specification gives; when set they win over the two above. Empty = use the above / the default.
      SLOW_API_THRESHOLD_MS: ${SLOW_API_THRESHOLD_MS:-}
      SLOW_DB_THRESHOLD_MS: ${SLOW_DB_THRESHOLD_MS:-}
      SLOW_SYNC_THRESHOLD_MS: ${SLOW_SYNC_THRESHOLD_MS:-3000}
      SLOW_REPORT_THRESHOLD_MS: ${SLOW_REPORT_THRESHOLD_MS:-2000}
      # Records are also kept in rotated, compressed files on the hesabkon_logs volume (the owner's timeline reads them).
      LOG_FILE_DIR: /app/logs
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      LOG_FILE_MAX_MB: ${LOG_FILE_MAX_MB:-300}
      # Optional: a central collector, and the Prometheus endpoint (both off when empty). See doc/logging/operations.md.
      LOG_REMOTE_URL: ${LOG_REMOTE_URL:-}
      LOG_REMOTE_TOKEN: ${LOG_REMOTE_TOKEN:-}
      LOG_REMOTE_MIN_LEVEL: ${LOG_REMOTE_MIN_LEVEL:-warn}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # The audit trail (see doc/logging/audit.md).
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}
      AUDIT_MONEY_MODE: ${AUDIT_MONEY_MODE:-values}
    ports:
      - "3000:3000"
    volumes:
      - hesabkon_logs:/app/logs
    # Docker keeps container stdout in one ever-growing file unless told otherwise. Five files of
    # 20 MB per container is a hard ceiling on what the logs may occupy (~100 MB), oldest dropped first.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  hesabkon_pgdata:
  hesabkon_logs:
